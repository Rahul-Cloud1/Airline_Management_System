server.port=8081
spring.application.name=passengerservice

## spring datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/passengerdb
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Rahul@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#eureka client settings
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.server.enableReplication=false
eureka.client.serviceUrl.defaultZone=http://eurekaserver:eurekaserver@localhost:8761/eureka/
spring.security.user.name=${SERVICE_SECURITY_USER_NAME:root}
spring.security.user.password=${SERVICE_SECURITY_USER_PASSWORD:Rahul@1234}